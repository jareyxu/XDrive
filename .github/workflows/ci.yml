name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Locked toolchain, tests, race checks, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Verify locked toolchain
        run: |
          test "$(go version)" = "go version go1.27.1 linux/amd64"
          test "$(node --version)" = "v26.0.0"
          test "$(pnpm --version)" = "11.24.0"

      - name: Install locked web dependencies
        run: make web-install

      - name: Run project checks
        run: make test

      - name: Run all-package race tests
        run: go test -race -count=1 ./...

      - name: Build service binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/xdrive ./cmd/xdrive

      - name: Cross-build Linux amd64 and arm64 releases
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          GOARCH=amd64 go build -trimpath -o /tmp/xdrive-linux-amd64 ./cmd/xdrive
          GOARCH=arm64 go build -trimpath -o /tmp/xdrive-linux-arm64 ./cmd/xdrive

      - name: Upload embedded web assets for tagged releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xdrive-web-assets
          path: internal/server/static/
          if-no-files-found: error
          retention-days: 7
